# STAGE 2 — config/corneish_zen.conf with the display tweaks ENABLED.
#
# Only apply this AFTER stage 1 (the west.yml fork swap) has built all three
# artifacts successfully. Requires config/west.yml to point at the
# zen-display-patches fork; these symbols do not exist in mainline ZMK.
#
# Rollback: your stage 1 conf (all four options commented out).

# ZMK Studio is enabled per-build via cmake-args in build.yaml (the *_studio
# artifact), NOT here — so the normal firmware stays lean.

# ---- Mouse / pointing (used by the Mouse layer) ----
CONFIG_ZMK_POINTING=y

# ---- Displays (IL0323 e-ink on the Zen) ----
CONFIG_ZMK_DISPLAY=y

# ---- Power ----
CONFIG_ZMK_SLEEP=y

# ---- Optional: bump BLE TX power for range/reliability ----
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---------------------------------------------------------------------------
# Fork-only display tweaks
# ---------------------------------------------------------------------------
# If any of these is missing from the fork, the build still SUCCEEDS but logs
# "attempt to assign the value 'y' to the undefined symbol ...". Grep the log
# for "undefined symbol" — a clean build is not proof these took effect.

# Skip layer-widget repaints for momentary layers (&mo, &lt).
# Visible test: the Game layer (entered with &to) should still appear on the
# display; GameNum (entered with &mo) should not.
CONFIG_ZMK_DISPLAY_HIDE_MOMENTARY_LAYERS=y

# Drop the "LAYER" heading and realign the widgets.
CONFIG_CUSTOM_WIDGET_LAYER_STATUS_HIDE_HEADING=y

# Miryoku logo instead of the Corne-ish Zen logo on the RIGHT half.
# Only visible after flashing the right-hand firmware.
CONFIG_CUSTOM_WIDGET_LOGO_IMAGE_MIRYOKU=y

# White-on-black displays. The most obvious one to eyeball first.
CONFIG_IL0323_INVERT=y

# ---- Not in the original Miryoku example; try these last, one at a time ----
# CONFIG_ZMK_DISPLAY_FULL_REFRESH_PERIOD=3600
# CONFIG_IL0323_ALTERNATIVE_REFRESH=y
